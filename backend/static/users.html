<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>账号管理</title>
  <style>
    :root{color-scheme:light;--page:#f4f6f8;--panel:#fff;--text:#18212b;--muted:#66717d;--line:#dfe4e8;--accent:#087f8c;--accent-soft:#e4f5f3;--danger:#b42318;--ok:#067647;--warning:#b54708}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at 8% 0,#dff3f1 0,transparent 27%),radial-gradient(circle at 95% 0,#e4edff 0,transparent 25%),var(--page);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{width:min(1240px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:750}.topnav{display:flex;gap:10px}.navlink{border:1px solid var(--line);border-radius:999px;background:#ffffffbd;padding:8px 14px;color:var(--text);text-decoration:none}.navlink:hover{background:#fff;border-color:#aeb8c1}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:54px 0 28px}.hero h1{margin:0 0 8px;font-size:clamp(30px,5vw,48px);letter-spacing:-.035em}.hero p{margin:0;color:var(--muted);font-size:16px}.summary{display:flex;gap:8px;flex-wrap:wrap}.stat{min-width:100px;padding:12px 14px;border:1px solid #fff;border-radius:15px;background:#ffffffbd}.stat strong{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
    .hero{padding:14px 0 10px}.hero h1{margin:0 0 3px;font-size:clamp(26px,2.8vw,34px);letter-spacing:-.025em}.hero p{font-size:14px}.summary{gap:6px}.stat{min-width:84px;padding:6px 10px;border-radius:12px}.stat strong{font-size:17px;line-height:1.1}.stat span{font-size:10px}
    .card{margin-bottom:18px;padding:24px;border:1px solid #fff;border-radius:20px;background:#ffffffdc;box-shadow:0 14px 42px #24344710;backdrop-filter:blur(18px)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.card h2{margin:0;font-size:20px}.subtle{color:var(--muted)}.create-grid{display:grid;grid-template-columns:1fr 1.15fr 1.15fr 150px auto;gap:10px}.field{height:42px;padding:0 12px;border:1px solid #ccd4da;border-radius:10px;background:#fbfbfd;outline:none}.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px #087f8c1d}.btn{height:38px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);cursor:pointer;white-space:nowrap}.btn:hover{border-color:#aeb8c1}.btn.primary{height:42px;border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}.btn.danger{border-color:#f0b7b2;color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.45}.message{display:none;margin:0 0 16px;padding:11px 13px;border-radius:10px}.message.show{display:block}.message.ok{background:#ecfdf3;color:var(--ok)}.message.error{background:#fef3f2;color:var(--danger)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f7f9fa;color:var(--muted);font-size:12px;font-weight:650}tr:last-child td{border-bottom:0}.user-name strong{display:block}.user-name span{color:var(--muted);font-size:12px}.role-select{height:34px;padding:0 27px 0 9px;border:1px solid var(--line);border-radius:8px;background:#fff}.state{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#12b76a}.state.off .dot{background:#98a2b3}.actions{display:flex;gap:7px;justify-content:flex-end}.tag{display:inline-flex;border-radius:999px;background:var(--accent-soft);padding:3px 8px;color:var(--accent);font-size:11px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px}.pagination-summary{color:var(--muted);font-size:13px}.pagination-controls{display:flex;align-items:center;gap:7px}.page-btn{min-width:38px;padding:0 10px}.page-btn.current{border-color:var(--accent);background:var(--accent);color:#fff}.page-size{height:38px;padding:0 28px 0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
    dialog{width:min(780px,calc(100% - 24px));max-height:88vh;padding:0;border:0;border-radius:20px;background:#fff;color:var(--text);box-shadow:0 30px 90px #0c172a45}dialog::backdrop{background:#17202a80;backdrop-filter:blur(3px)}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:20px}.dialog-body{max-height:62vh;padding:20px 22px;overflow:auto}.dialog-foot{justify-content:flex-end;border-top:1px solid var(--line);border-bottom:0}.permission-group{margin-bottom:20px}.permission-group h3{margin:0 0 8px;font-size:14px}.permission-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.permission{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px}.permission input{margin-top:3px}.permission strong{display:block;font-size:13px}.permission span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}.admin-note{padding:12px;border-radius:10px;background:#fff8eb;color:var(--warning)}
    @media(max-width:900px){.create-grid{grid-template-columns:1fr 1fr}.create-grid .primary{grid-column:span 2}.hero{align-items:start;flex-direction:column}.summary{width:100%}.stat{flex:1}.permission-list{grid-template-columns:1fr}}@media(max-width:560px){.shell{width:min(100% - 20px,1240px)}.create-grid{grid-template-columns:1fr}.create-grid .primary{grid-column:auto}.topnav .optional{display:none}.card{padding:17px}.actions{justify-content:start}.pagination{align-items:flex-start;flex-direction:column}.pagination-controls{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand">DENGTEC · ADMIN</div><nav class="topnav"><a class="navlink" href="/">应用导航</a><a class="navlink optional" href="/account">个人中心</a></nav></header>
    <section class="hero"><div><h1>账号管理</h1><p>统一管理平台账号、角色、状态与应用权限。</p></div><div class="summary"><div class="stat"><strong id="total-count">—</strong><span>全部账号</span></div><div class="stat"><strong id="active-count">—</strong><span>启用账号</span></div><div class="stat"><strong id="admin-count">—</strong><span>管理员</span></div></div></section>
    <div class="message" id="message" role="status"></div>
    <section class="card">
      <div class="card-head"><div><h2>新建账号</h2><div class="subtle">创建后可继续配置应用访问权限</div></div></div>
      <form class="create-grid" id="create-form"><input class="field" id="new-username" placeholder="用户名" autocomplete="off" required><input class="field" id="new-display-name" placeholder="显示名称（选填）" autocomplete="off"><input class="field" id="new-password" type="password" placeholder="初始密码（至少 8 位）" autocomplete="new-password" minlength="8" required><select class="field" id="new-role"><option value="user">普通用户</option><option value="admin">管理员</option></select><button class="btn primary" type="submit">创建账号</button></form>
    </section>
    <section class="card">
      <div class="card-head"><div><h2>用户列表</h2><div class="subtle">管理员默认拥有全部权限</div></div><button class="btn" id="refresh-users" type="button">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>权限</th><th>创建时间</th><th style="text-align:right">操作</th></tr></thead><tbody id="users"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody></table></div>
    </section>
    <section class="card">
      <div class="card-head"><div><h2>登录记录</h2><div class="subtle">保留最近 5000 条</div></div><button class="btn" id="refresh-events" type="button">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>时间</th><th>用户名</th><th>结果</th><th>IP 地址</th><th>客户端</th></tr></thead><tbody id="events"><tr><td colspan="5" class="empty">正在加载…</td></tr></tbody></table></div>
      <div class="pagination" id="events-pagination" hidden><div class="pagination-summary" id="events-page-summary"></div><div class="pagination-controls"><select class="page-size" id="events-page-size" aria-label="每页显示条数"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option><option value="100">100 条/页</option></select><button class="btn page-btn" id="events-prev" type="button">上一页</button><div class="pagination-controls" id="events-pages"></div><button class="btn page-btn" id="events-next" type="button">下一页</button></div></div>
    </section>
  </main>
  <dialog id="permission-dialog"><div class="dialog-head"><div><h2>访问权限</h2><div class="subtle" id="permission-user"></div></div><button class="btn" id="close-permissions" type="button">关闭</button></div><div class="dialog-body" id="permission-body"></div><div class="dialog-foot"><button class="btn" id="cancel-permissions" type="button">取消</button><button class="btn primary" id="save-permissions" type="button">保存权限</button></div></dialog>
  <script>
    const state={me:null,users:[],permissions:[],editing:null,eventPage:1,eventPageSize:10,eventTotal:0,eventPages:1};
    const usersBody=document.querySelector('#users'),eventsBody=document.querySelector('#events'),message=document.querySelector('#message'),dialog=document.querySelector('#permission-dialog'),eventsPagination=document.querySelector('#events-pagination');
    function flash(text,tone='ok'){message.textContent=text;message.className='message show '+tone;window.scrollTo({top:0,behavior:'smooth'})}
    async function readError(response){const body=await response.json().catch(()=>({}));return body.detail||body.error||'操作失败'}
    function formatTime(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?value:new Intl.DateTimeFormat('zh-CN',{dateStyle:'short',timeStyle:'medium',hour12:false}).format(date)}
    function button(label,action,className='btn'){const element=document.createElement('button');element.type='button';element.className=className;element.textContent=label;element.addEventListener('click',action);return element}
    async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options,headers:{accept:'application/json',...(options.headers||{})}});if(response.status===401){location.replace('/login?next='+encodeURIComponent('/admin/users'));throw new Error('请重新登录')}if(response.status===403)throw new Error('当前账号没有用户管理权限');if(!response.ok)throw new Error(await readError(response));return response.status===204?{}:response.json()}
    async function loadIdentity(){const auth=await api('/api/auth/me');state.me=auth.user||auth}
    async function loadPermissions(){const data=await api('/api/admin/permissions');state.permissions=data.permissions||[]}
    async function loadUsers(){usersBody.innerHTML='<tr><td colspan="6" class="empty">正在加载…</td></tr>';try{const data=await api('/api/admin/users');state.users=data.users||[];renderUsers()}catch(error){usersBody.innerHTML='<tr><td colspan="6" class="empty"></td></tr>';usersBody.querySelector('td').textContent=error.message}}
    function renderUsers(){usersBody.replaceChildren();document.querySelector('#total-count').textContent=state.users.length;document.querySelector('#active-count').textContent=state.users.filter(user=>user.is_active).length;document.querySelector('#admin-count').textContent=state.users.filter(user=>user.role==='admin').length;if(!state.users.length){usersBody.innerHTML='<tr><td colspan="6" class="empty">暂无账号</td></tr>';return}state.users.forEach(user=>{
      const row=document.createElement('tr');const self=state.me&&Number(state.me.id)===Number(user.id);
      const identity=document.createElement('td');identity.className='user-name';const strong=document.createElement('strong');strong.textContent=user.display_name||user.username;identity.append(strong);const sub=document.createElement('span');sub.textContent='@'+user.username+(self?' · 当前账号':'');identity.append(sub);
      const roleCell=document.createElement('td');const role=document.createElement('select');role.className='role-select';role.innerHTML='<option value="user">普通用户</option><option value="admin">管理员</option>';role.value=user.role;role.addEventListener('change',async()=>{try{await updateUser(user.id,{role:role.value});flash('角色已更新')}catch(error){role.value=user.role;flash(error.message,'error')}});roleCell.append(role);
      const activeCell=document.createElement('td');const active=document.createElement('label');active.className='state'+(user.is_active?'':' off');const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=Boolean(user.is_active);toggle.disabled=self;toggle.addEventListener('change',async()=>{try{await updateUser(user.id,{is_active:toggle.checked});flash(toggle.checked?'账号已启用':'账号已停用')}catch(error){toggle.checked=!toggle.checked;flash(error.message,'error')}});active.append(toggle);const dot=document.createElement('span');dot.className='dot';active.append(dot,document.createTextNode(user.is_active?'正常':'停用'));activeCell.append(active);
      const permissionCell=document.createElement('td');if(user.role==='admin'){const tag=document.createElement('span');tag.className='tag';tag.textContent='全部权限';permissionCell.append(tag)}else permissionCell.append(button(`${(user.permissions||[]).length} 项 · 配置`,()=>openPermissions(user)));
      const time=document.createElement('td');time.textContent=formatTime(user.created_at);
      const actions=document.createElement('td');actions.className='actions';actions.append(button('重置密码',()=>resetPassword(user)));const remove=button('删除',()=>deleteUser(user),'btn danger');remove.disabled=self;actions.append(remove);
      row.append(identity,roleCell,activeCell,permissionCell,time,actions);usersBody.append(row)
    })}
    async function updateUser(id,patch){await api('/api/admin/users/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(patch)});await loadUsers()}
    async function resetPassword(user){const password=prompt(`为 ${user.username} 设置新密码（至少 8 位）`);if(password===null)return;if(password.length<8){flash('密码至少需要 8 位','error');return}try{await api(`/api/admin/users/${user.id}/password`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});flash('密码已重置，该账号现有登录已退出')}catch(error){flash(error.message,'error')}}
    async function deleteUser(user){if(!confirm(`确认删除账号“${user.username}”？此操作不可撤销。`))return;try{await api(`/api/admin/users/${user.id}`,{method:'DELETE'});flash('账号已删除');await loadUsers()}catch(error){flash(error.message,'error')}}
    function openPermissions(user){state.editing=user;document.querySelector('#permission-user').textContent=(user.display_name||user.username)+' · @'+user.username;const body=document.querySelector('#permission-body');body.replaceChildren();const selected=new Set(user.permissions||[]);const groups=Map.groupBy?Map.groupBy(state.permissions,item=>item.group_name):state.permissions.reduce((map,item)=>{const key=item.group_name||'其他';map.set(key,[...(map.get(key)||[]),item]);return map},new Map());for(const [name,items] of groups){const section=document.createElement('section');section.className='permission-group';const title=document.createElement('h3');title.textContent=name;const list=document.createElement('div');list.className='permission-list';items.forEach(item=>{const label=document.createElement('label');label.className='permission';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=item.key;checkbox.checked=selected.has(item.key);const copy=document.createElement('span');const key=document.createElement('strong');key.textContent=item.key;const description=document.createElement('span');description.textContent=item.description;copy.append(key,description);label.append(checkbox,copy);list.append(label)});section.append(title,list);body.append(section)}dialog.showModal()}
    async function savePermissions(){if(!state.editing)return;const permissions=[...document.querySelectorAll('#permission-body input:checked')].map(input=>input.value);try{await api(`/api/admin/users/${state.editing.id}/permissions`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({permissions})});dialog.close();flash('权限已保存');await loadUsers()}catch(error){flash(error.message,'error')}}
    function pageNumbers(page,pages){const values=[];for(let value=1;value<=pages;value++){if(value===1||value===pages||Math.abs(value-page)<=1)values.push(value);else if(values.at(-1)!=='…')values.push('…')}return values}
    function renderEventPagination(){eventsPagination.hidden=state.eventTotal===0;document.querySelector('#events-page-summary').textContent=`共 ${state.eventTotal} 条，第 ${state.eventPage} / ${state.eventPages} 页`;document.querySelector('#events-prev').disabled=state.eventPage<=1;document.querySelector('#events-next').disabled=state.eventPage>=state.eventPages;const pages=document.querySelector('#events-pages');pages.replaceChildren();pageNumbers(state.eventPage,state.eventPages).forEach(value=>{if(value==='…'){const ellipsis=document.createElement('span');ellipsis.className='subtle';ellipsis.textContent='…';pages.append(ellipsis);return}const pageButton=button(String(value),()=>loadEvents(value),'btn page-btn'+(value===state.eventPage?' current':''));pageButton.setAttribute('aria-label',`第 ${value} 页`);if(value===state.eventPage)pageButton.setAttribute('aria-current','page');pages.append(pageButton)})}
    async function loadEvents(page=state.eventPage){eventsBody.innerHTML='<tr><td colspan="5" class="empty">正在加载…</td></tr>';eventsPagination.hidden=true;try{const data=await api(`/api/admin/login-events?page=${page}&page_size=${state.eventPageSize}`);const pagination=data.pagination||{};state.eventPage=Number(pagination.page)||1;state.eventPageSize=Number(pagination.page_size)||state.eventPageSize;state.eventTotal=Number(pagination.total)||0;state.eventPages=Number(pagination.pages)||1;eventsBody.replaceChildren();if(!(data.events||[]).length){eventsBody.innerHTML='<tr><td colspan="5" class="empty">暂无登录记录</td></tr>';renderEventPagination();return}(data.events||[]).forEach(event=>{const row=document.createElement('tr');const cells=[formatTime(event.created_at),event.username,event.success?'成功':'失败',event.ip||'—',event.user_agent||'—'];cells.forEach((text,index)=>{const cell=document.createElement('td');cell.textContent=text;if(index===2){const tag=document.createElement('span');tag.className='tag';tag.style.background=event.success?'#ecfdf3':'#fef3f2';tag.style.color=event.success?'var(--ok)':'var(--danger)';tag.textContent=text;cell.replaceChildren(tag)}if(index===4){cell.title=text;cell.textContent=text.length>72?text.slice(0,72)+'…':text}row.append(cell)});eventsBody.append(row)});renderEventPagination()}catch(error){eventsBody.innerHTML='<tr><td colspan="5" class="empty"></td></tr>';eventsBody.querySelector('td').textContent=error.message}}
    document.querySelector('#create-form').addEventListener('submit',async event=>{event.preventDefault();const username=document.querySelector('#new-username').value.trim(),display_name=document.querySelector('#new-display-name').value.trim(),password=document.querySelector('#new-password').value,role=document.querySelector('#new-role').value;if(password.length<8){flash('初始密码至少需要 8 位','error');return}try{await api('/api/admin/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,display_name,password,role})});event.target.reset();flash('账号已创建');await loadUsers()}catch(error){flash(error.message,'error')}});
    document.querySelector('#refresh-users').addEventListener('click',loadUsers);document.querySelector('#refresh-events').addEventListener('click',()=>loadEvents());document.querySelector('#events-prev').addEventListener('click',()=>loadEvents(state.eventPage-1));document.querySelector('#events-next').addEventListener('click',()=>loadEvents(state.eventPage+1));document.querySelector('#events-page-size').addEventListener('change',event=>{state.eventPageSize=Number(event.target.value);loadEvents(1)});document.querySelector('#close-permissions').addEventListener('click',()=>dialog.close());document.querySelector('#cancel-permissions').addEventListener('click',()=>dialog.close());document.querySelector('#save-permissions').addEventListener('click',savePermissions);
    Promise.all([loadIdentity(),loadPermissions()]).then(()=>Promise.all([loadUsers(),loadEvents()])).catch(error=>flash(error.message,'error'));
  </script>
</body>
</html>
