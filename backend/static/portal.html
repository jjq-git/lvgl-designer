<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>应用导航</title>
  <style>
    :root{color-scheme:light;--page:#f4f6f8;--panel:#fff;--text:#18212b;--muted:#66717d;--line:#dfe4e8;--accent:#087f8c;--accent2:#1367d1}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at 15% 0,#dff3f1 0,transparent 34%),radial-gradient(circle at 90% 5%,#e4edff 0,transparent 30%),var(--page);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .shell{width:min(1080px,calc(100% - 40px));margin:0 auto;padding:30px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:750;letter-spacing:.02em}.account{position:relative;color:var(--muted)}button{font:inherit}.account-menu summary{list-style:none;border:1px solid var(--line);border-radius:999px;background:#ffffffb8;padding:8px 14px;color:var(--text);cursor:pointer}.account-menu summary::-webkit-details-marker{display:none}.account-menu[open] summary{border-color:#aeb8c1;background:#fff}.menu{position:absolute;z-index:5;top:calc(100% + 8px);right:0;display:grid;min-width:180px;padding:7px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 18px 46px #24344724}.menu a,.menu button{border:0;border-radius:9px;background:transparent;padding:10px 11px;color:var(--text);text-align:left;text-decoration:none;cursor:pointer}.menu a:hover,.menu button:hover{background:#f1f5f6}.menu .logout{color:#b42318}
    .hero{padding:22px 0 16px}.eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:4px 0;font-size:clamp(26px,2.6vw,34px);line-height:1.12;letter-spacing:-.025em}.hero p{max-width:630px;margin:0;color:var(--muted);font-size:14px;line-height:1.45}
    .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.app{position:relative;display:flex;min-height:220px;flex-direction:column;padding:24px;border:1px solid #ffffff80;border-radius:22px;background:#ffffffcf;color:inherit;text-decoration:none;box-shadow:0 16px 50px #24344712;backdrop-filter:blur(18px);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.app:hover{transform:translateY(-3px);border-color:#a9d9dc;box-shadow:0 20px 56px #24344720}.app.unavailable{pointer-events:none;opacity:.52}.icon{display:grid;width:48px;height:48px;place-items:center;border-radius:15px;background:#e4f5f3;color:var(--accent)}.app:nth-child(2n) .icon{background:#e7effe;color:var(--accent2)}.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.app h2{margin:28px 0 8px;font-size:22px}.app p{margin:0;color:var(--muted);line-height:1.6}.enter{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:22px;color:var(--accent);font-weight:700}.status{margin:28px 0;color:var(--muted)}
    @media(max-width:620px){.shell{width:min(100% - 24px,1080px);padding-top:20px}.hero{padding:20px 0 14px}.account span{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">DENGTEC · APPLICATIONS</div>
      <div class="account"><details class="account-menu"><summary id="account">正在读取账号…</summary><div class="menu"><a href="/account">个人中心</a><a href="/admin/users" id="admin-link" hidden>账号管理</a><button class="logout" id="logout" type="button">退出登录</button></div></details></div>
    </header>
    <section class="hero">
      <div class="eyebrow">Application Portal</div>
      <h1>选择要进入的应用</h1>
      <p>所有应用共用当前账号和登录状态。后续新增工具会继续显示在这里。</p>
    </section>
    <section class="apps" id="apps" aria-live="polite"></section>
    <p class="status" id="status">正在加载应用…</p>
  </main>
  <script>
    const icons={
      'lvgl-designer':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h10M7 12h4M7 16h7"/></svg>',
      datasheets:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h5M9 12h7M9 16h7"/></svg>'
    };
    const apps=document.querySelector('#apps'),status=document.querySelector('#status'),account=document.querySelector('#account');
    Promise.all([
      fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('auth');return r.json()}),
      fetch('/api/apps',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('apps');return r.json()})
    ]).then(([auth,catalog])=>{
      const user=auth.user||auth;
      account.textContent=(user.display_name||user.username)+' · '+(user.role==='admin'?'管理员':'用户');
      document.querySelector('#admin-link').hidden=user.role!=='admin';
      apps.replaceChildren(...catalog.apps.map(item=>{
        const card=document.createElement('a');
        card.className='app'+(item.available?'':' unavailable');
        card.href=item.available?item.path:'#';
        card.innerHTML='<span class="icon">'+(icons[item.id]||icons.datasheets)+'</span><h2></h2><p></p><span class="enter">'+(item.available?'进入应用 →':'暂未部署')+'</span>';
        card.querySelector('h2').textContent=item.name;
        card.querySelector('p').textContent=item.description;
        return card;
      }));
      status.textContent=catalog.apps.length?'':'当前账号没有可访问的应用。';
    }).catch(()=>{location.replace('/login?next='+encodeURIComponent('/'))});
    document.querySelector('#logout').addEventListener('click',async()=>{
      try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}finally{location.replace('/login')}
    });
  </script>
</body>
</html>
