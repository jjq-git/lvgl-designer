<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · LVGL Designer</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#f5f5f7;color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.card{width:min(380px,100%);padding:38px 32px;background:#fff;border:1px solid #e5e5e7;border-radius:18px;box-shadow:0 14px 44px #00000014}.brand{text-align:center;color:#6e6e73;font-weight:600}h1{text-align:center;font-size:25px;margin:8px 0 28px}label{display:block;margin:15px 2px 6px;color:#6e6e73}input{width:100%;height:44px;padding:0 13px;border:1px solid #d2d2d7;border-radius:11px;background:#fbfbfd;font:inherit;font-size:16px;outline:none}input:focus{border-color:#0071e3;box-shadow:0 0 0 4px #0071e326}button{width:100%;height:46px;margin-top:22px;border:0;border-radius:11px;background:#0071e3;color:#fff;font:inherit;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.error{display:none;margin:14px 0 0;padding:10px;border-radius:9px;background:#fdecec;color:#b3261e;text-align:center}.error.show{display:block}.quick-login{margin:20px 0 0;padding-top:17px;border-top:1px solid #ededf0;text-align:center;color:#86868b;font-size:12px}.quick-account{width:auto;height:auto;margin:8px 0 0;padding:8px 14px;border:1px solid #c7ddf7;border-radius:999px;background:#f2f7fd;color:#0066cc;font-size:13px}.quick-account:hover{background:#e6f1fc}.quick-account:focus-visible{outline:3px solid #0071e340;outline-offset:2px}
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="brand">LVGL Designer</div><h1>登录</h1>
    <label for="username">用户名</label><input id="username" autocomplete="username" required autofocus>
    <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录</button>
    <p class="error" id="error"></p>
    <div class="quick-login">
      <div>快捷登录账号（点击自动填入）</div>
      <button class="quick-account" id="quick-admin" type="button">admin / admin123</button>
    </div>
  </form>
  <script>
    const form=document.querySelector('#login-form'),button=document.querySelector('#submit'),error=document.querySelector('#error'),username=document.querySelector('#username'),password=document.querySelector('#password');
    document.querySelector('#quick-admin').addEventListener('click',()=>{username.value='admin';password.value='admin123';username.dispatchEvent(new Event('input',{bubbles:true}));password.dispatchEvent(new Event('input',{bubbles:true}));password.focus()});
    form.addEventListener('submit',async(event)=>{event.preventDefault();button.disabled=true;error.classList.remove('show');try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:username.value,password:password.value})});if(response.ok){location.replace('/');return}const body=await response.json().catch(()=>({}));error.textContent=response.status===503?'尚未配置管理员账号，请检查 .env 后重启。':(body.detail||'用户名或密码错误');error.classList.add('show')}catch{error.textContent='无法连接服务器';error.classList.add('show')}finally{button.disabled=false}});
  </script>
</body>
</html>
