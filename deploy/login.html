<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · LVGL Web Designer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 32px 32px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
  }
  .logo {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #6e6e73;
    text-align: center;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 28px;
    letter-spacing: -0.2px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #6e6e73;
    margin: 0 0 6px 2px;
  }
  input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 16px;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    background: #fbfbfd;
    color: #1d1d1f;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    background: #fff;
  }
  .field { margin-bottom: 16px; }
  button {
    width: 100%;
    height: 46px;
    margin-top: 6px;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    background: #0071e3;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:hover { background: #0077ed; }
  button:active { background: #006edb; }
  button:disabled { opacity: .5; cursor: default; }
  .error {
    display: none;
    margin: 14px 0 0;
    padding: 10px 12px;
    font-size: 13px;
    color: #b3261e;
    background: #fdecec;
    border-radius: 10px;
    text-align: center;
  }
  .error.show { display: block; }
  .foot {
    margin-top: 22px;
    font-size: 12px;
    color: #86868b;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo">LVGL Web Designer</div>
    <h1>登录</h1>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submitBtn">登录</button>
    <p class="error" id="errBox"></p>
    <div class="foot">仅授权用户可访问</div>
  </form>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('errBox');
      function showErr(msg) { err.textContent = msg; err.classList.add('show'); }
      function clearErr() { err.classList.remove('show'); }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErr();
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        btn.disabled = true;
        btn.textContent = '登录中…';
        fetch('./api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
          credentials: 'same-origin',
        }).then(function (r) {
          if (r.ok) { window.location.replace('./'); return; }
          return r.json().catch(function () { return {}; }).then(function () {
            showErr('用户名或密码错误');
            btn.disabled = false;
            btn.textContent = '登录';
          });
        }).catch(function () {
          showErr('网络错误,请重试');
          btn.disabled = false;
          btn.textContent = '登录';
        });
      });
    })();
  </script>
</body>
</html>
